<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Permiso de cámara · Capas</title>
  <link rel="icon" href="icons/32.png">
  <style>
    :root {
      --teal: #3EC5B5; --deep: #1B6E8C; --deep-hover: #165C75; --ink: #17313F; --muted: #5D7583;
      --bg: #F4F7F8; --surface: #FFFFFF; --line: #E6ECEF; --danger: #C94141;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
      background: var(--bg); color: var(--ink); font: 400 15px/1.5 Inter, system-ui, sans-serif;
    }
    main {
      width: min(100%, 460px); padding: 32px; border: 1px solid var(--line); border-radius: 16px;
      background: var(--surface); box-shadow: 0 1px 2px rgba(23, 49, 63, .05), 0 4px 16px rgba(23, 49, 63, .06);
    }
    h1 { margin: 16px 0 8px; font: 700 22px/1.25 "Space Grotesk", system-ui, sans-serif; letter-spacing: -.01em; }
    p { margin: 0 0 12px; color: var(--muted); }
    button {
      display: inline-flex; align-items: center; height: 44px; margin-top: 8px; padding: 0 20px;
      border: 0; border-radius: 999px; background: var(--deep); color: #fff;
      font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    }
    button:hover { background: var(--deep-hover); }
    button:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
    [hidden] { display: none !important; }
    .status { min-height: 1.5em; margin: 16px 0 0; color: var(--ink); font-weight: 500; }
    .status.is-error { color: var(--danger); }
  </style>
</head>
<body>
  <main>
    <img src="icons/48.png" width="48" height="48" alt="">
    <h1>Permite la cámara para la burbuja</h1>
    <p>Mientras grabas con Capas, la extensión muestra tu cámara en una burbuja redonda en cualquier pestaña. Para eso, Chrome necesita tu permiso una vez.</p>
    <p>En el aviso de Chrome, elige la opción que lo permite siempre, no la de solo esta vez.</p>
    <button type="button" id="allow">Permitir cámara</button>
    <button type="button" id="settings" hidden>Abrir la configuración</button>
    <p class="status" id="status" role="status"></p>
  </main>
  <script src="permission.js"></script>
</body>
</html>
